<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arangkada Floridablanca Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{--fa:'Alpha','Alpha Display','Anton','Bebas Neue',Impact,sans-serif;--fg:'Gotham','Gotham Medium','Montserrat',Arial,sans-serif;
--cy:#00d9ff;--sky:#00baff;--bl:#008fff;--navy:#061d83;--ind:#1400ff}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fg);background:#e8f4ff;color:#111}
.panel{max-width:900px;margin:16px auto;background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px #0002}
.panel h1{font-family:var(--fa);font-weight:400;font-size:22px;margin:0 0 4px;color:var(--navy);letter-spacing:.5px}
.panel p{margin:0 0 12px;font-size:13px;color:#555}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{border-radius:8px;padding:10px;color:#fff}
.box.d1{background:linear-gradient(#1400ff,#061d83)}.box.d2{background:linear-gradient(#ff0000,#8a0000)}.box.d3{background:linear-gradient(#00d9ff,#008fff)}
.box b{display:block;margin-bottom:6px}
label{display:block;font-size:12px;margin:6px 0 2px}
.box input{color:#111}
input{width:100%;padding:6px;border:1px solid #aaa;border-radius:5px;font-size:14px}
.opts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:end}.opts div{flex:1;min-width:150px}
button{padding:10px 18px;border:0;border-radius:6px;background:var(--ind);color:#fff;font-weight:bold;cursor:pointer;font-size:14px}
button.g{background:#222}
#info{font-size:13px;margin-top:8px}
#sheet{display:grid;grid-template-columns:190mm;justify-content:center;margin:10px auto}
/* ticket */
.t{--g:linear-gradient(#1400ff,#061d83);width:190mm;height:62mm;display:flex;break-inside:avoid;page-break-inside:avoid;border:.3mm dashed #666;overflow:hidden;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.t.d2{--g:linear-gradient(#ff2a2a,#8a0000)}.t.d3{--g:linear-gradient(#00d9ff,#008fff)}
.main,.stub{position:relative;background:linear-gradient(135deg,#fff 0 30%,#eaf7ff 30% 36%,#fff 36% 60%,#dff3ff 60% 66%,#fff 66%)}
.main{flex:1;padding:2mm 4mm 0;display:flex;flex-direction:column;min-width:0}
.bld,.stub .bld{position:absolute;left:0;right:0;bottom:0;height:75%;background:var(--bld) center bottom/cover no-repeat;opacity:.55;z-index:0}
.main>*,.stub>*{position:relative;z-index:1}
.logos{display:flex;gap:2.5mm;align-items:center;justify-content:center;height:12mm}
.logos img{height:11.5mm;width:auto;object-fit:contain}
.ttl{font-family:var(--fa);text-align:center;font-size:11.5mm;line-height:1;letter-spacing:.3mm;color:#fff;-webkit-text-stroke:.9mm var(--navy);paint-order:stroke fill;text-shadow:.7mm .7mm 0 var(--cy);margin-top:.5mm}
.sub{font-family:var(--fa);text-align:center;font-size:5.2mm;letter-spacing:.4mm;color:var(--navy);margin:.8mm 0}
.bar{background:linear-gradient(#333,#000);color:#fff;font-weight:800;text-align:center;font-size:3.4mm;padding:1mm 2mm;border-radius:1.5mm;box-shadow:0 .5mm 1mm #0006}
.note{font-style:italic;font-weight:700;font-size:2.3mm;text-align:center;margin:.8mm 0}
.band{display:flex;align-items:center;background:var(--g);border-radius:1.5mm;height:11mm;box-shadow:0 .5mm 1mm #0005;margin-bottom:1.5mm}
.band .s{flex:1;font-family:var(--fa);color:#fff;text-align:center;font-size:6.2mm;letter-spacing:.3mm;text-shadow:0 .3mm .6mm #0006}
.box2{font-family:var(--fa);background:linear-gradient(#333,#000);color:#fff;border:.6mm solid #fff;border-radius:1.5mm;padding:.6mm 4mm;font-size:7mm;line-height:1.1;box-shadow:0 0 0 .3mm #000}
.foot{margin:auto -4mm 0;height:5.5mm;background:linear-gradient(90deg,var(--sky),var(--bl) 40%,var(--ind));color:#fff;font-weight:800;font-size:2.6mm;display:flex;align-items:center;padding-left:4mm;position:relative}
.foot:after{content:"";position:absolute;right:0;top:0;bottom:0;width:30mm;background:repeating-linear-gradient(115deg,transparent 0 2mm,rgba(255,255,255,.9) 2mm 3.6mm)}
.live{background:#c00;border-radius:.8mm;padding:.2mm 1.2mm;margin-right:1.5mm}
.stub{width:40mm;border-left:.4mm dashed #444;padding:2mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.stub .a{font-family:var(--fa);font-size:5mm;line-height:1;color:#fff;-webkit-text-stroke:.6mm var(--navy);paint-order:stroke fill;text-shadow:.4mm .4mm 0 var(--cy)}
.stub .box2{font-size:8mm;padding:.5mm 3mm}
.stub .dt{background:var(--g);color:#fff;font-weight:800;font-size:3.4mm;padding:1.2mm 3mm;border-radius:1.5mm;width:100%}
.stub .sn{font-family:var(--fa);font-size:6mm;color:var(--navy)}
.stub .e{font-size:2.2mm;font-weight:700}
@page{size:A4;margin:6mm}
@media print{body{background:#fff}.panel{display:none}#sheet{margin:0}}
</style></head><body>
<div class="panel">
<h1>ARANGKADA FLORIDABLANCA 3 DAY INVITATIONAL LEAGUE</h1>
<p>Ticket stub generator. Set the quantity per day, press Generate, then Print.</p>
<div class="row">
<div class="box d1"><b>DAY 1 · Dec 4 · Blue</b><label>Quantity</label><input id="q1" type="number" min="0" value="500"><label>Start number</label><input id="s1" type="number" min="1" value="1"></div>
<div class="box d2"><b>DAY 2 · Dec 5 · Red</b><label>Quantity</label><input id="q2" type="number" min="0" value="500"><label>Start number</label><input id="s2" type="number" min="1" value="1"></div>
<div class="box d3"><b>DAY 3 · Dec 6 · Cyan</b><label>Quantity</label><input id="q3" type="number" min="0" value="500"><label>Start number</label><input id="s3" type="number" min="1" value="1"></div>
</div>
<div class="opts"><div><label>Price (optional, e.g. ₱50)</label><input id="price" placeholder="leave blank for none"></div>
<div><label>Year</label><input id="year" type="number" value="2026"></div>
<button onclick="gen()">Generate</button><button class="g" onclick="window.print()">Print</button></div>
<div id="info"></div></div>
<div id="sheet"></div>

  DAYS.forEach(D=>{
    const q=Math.max(0,parseInt(q_(D.n))||0),s=Math.max(1,parseInt(document.getElementById("s"+D.n).value)||1);
    for(let i=0;i<q;i++){const no="D"+D.n+"-"+pad(s+i);
    h+=`<div class="t d${D.n}"><div class="main"><div class="bld"></div>
<div class="logos"><img src="${L.a}" alt=""><img src="${L.f}" alt=""><img src="${L.m}" alt=""></div>
<div class="ttl">ARANGKADA FLORIDABLANCA</div><div class="sub">3 DAY INVITATIONAL LEAGUE</div>
<div class="bar">DECEMBER ${D.d}, ${yr} • ${D.w} • Floridablanca Sports Center</div>
<div class="note">Please come in time 15 minutes prior to the games. Non-transferable.</div>
<div class="band"><div class="s">ADMIT ONE${price?" • "+price:""}</div><div class="box2">DAY ${D.n}</div><div class="s">No. ${no}</div></div>
<div class="foot">THIS IS NOT FOR SALE</div></div>
<div class="stub"><div class="bld"></div><div class="a">ARANGKADA<br>FLORIDABLANCA</div><div class="box2">DAY ${D.n}</div><div class="dt">DEC ${D.d}, ${yr}</div><div class="sn">${no}</div><div class="e">ADMIT ONE</div></div></div>`}
    tot+=q});
  if(tot>3000){document.getElementById("info").textContent="Max 3000 per generate. Lower the quantities.";return}
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("info").textContent=tot+" tickets ("+Math.ceil(tot/4)+" A4 pages, 4 per page). In print, set margins Default and enable Background graphics.";
}
function q_(n){return document.getElementById("q"+n).value}
gen();
</script></body></html>
